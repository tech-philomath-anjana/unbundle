[project]
name = "unbundle"
version = "0.1.0"
description = "Works out which orders are inside each bank settlement and reports what it can't account for."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
